site_name: MISP Docker Lifecycle Manager

site_description: >-
  Lifecycle management tooling for official MISP Docker
  single-server deployments.

repo_url: https://github.com/Tuxmint-Open-Source/misp-docker-lifecycle-manager
repo_name: Tuxmint-Open-Source/misp-docker-lifecycle-manager
edit_uri: edit/main/docs/

extra_css:
  - assets/stylesheets/brand.css

docs_dir: .generated-docs

theme:
  name: material
  logo: assets/brand/misp-dlm-mark.svg
  favicon: assets/brand/misp-dlm-favicon-32.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Choose a task: README.md

  - Evaluate support:
      - Support matrix: support-matrix.md
      - Compatibility: compatibility.md
      - Current validation evidence: validation/compatibility-v1.4.1-misp-core-v2.5.44.md
      - Validation matrix: validation/matrix.md
      - Evidence archive: validation/README.md
      - Production readiness: production-readiness.md

  - Install:
      - Getting started: getting-started.md
      - Operator bundle: operator-bundle.md

  - Operate and update:
      - Operator guide: operator-guide.md
      - Upgrade path: upgrade-path.md
      - Monitoring: monitoring.md

  - Back up and recover:
      - Backup, restore and rollback: backup-restore-and-rollback.md

  - Deploy securely:
      - Production deployment: production-deployment.md
      - Security: security.md
      - Architecture: architecture.md

  - Troubleshoot and report:
      - Troubleshooting: troubleshooting.md
      - SOS reports: sos-report.md

  - Contribute and maintain:
      - Contributor and maintainer path: contribute-and-maintain.md
      - Project origin and transparency: project-origin-and-transparency.md
      - Maintainer workflow: maintainer-workflow.md
      - Release process: release/release-process.md
      - Integrity and provenance: release/integrity-and-provenance.md
      - Versioning: versioning.md
      - Upstream inputs: upstream-inputs.md
      - Shell scripts: shell-scripts.md
      - Brand assets: brand-assets.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
