name: CodeQL

on:
  pull_request:
    paths:
      - ".github/workflows/codeql.yml"
      - "scripts/**/*.py"
      - "tests/**/*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codeql.yml"
      - "scripts/**/*.py"
      - "tests/**/*.py"
  schedule:
    # Weekly, intentionally offset from other scheduled workflows.
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action@v4
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        # github/codeql-action@v4
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
