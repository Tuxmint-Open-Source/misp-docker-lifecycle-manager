version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      workflow-bootstrap-actions:
        patterns:
          - "actions/checkout"
          - "actions/setup-python"
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    labels:
      - "type: maintenance"
      - "area: github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
